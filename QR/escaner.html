<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Registradora Local - Escáner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #121212; 
            color: white; 
            padding: 20px; 
            margin: 0;
        }
        h2 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }
       
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            color: black;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
       
        #reader button {
            background: #007AFF; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            margin: 10px; 
            cursor: pointer;
        }
        #status { 
            margin-top: 30px; 
            font-size: 1.4em; 
            height: 50px;
        }
    </style>
</head>
<body>
    <h2>Caja Registradora</h2>
    <p>Apunta la cámara al código QR del producto</p>

    <div id="reader"></div>
    
    <div id="status">Esperando escaneo...</div>
    
    <script>
        const status = document.getElementById('status');
        let ultimoEscaneado = ""; 

        // 🛠️ ACTUALIZA ESTA IP CON LA DE TU PC (REVISA CON 'ipconfig')
        const IP_SERVIDOR = "192.168.0.10"; 
        const PUERTO_SSL = "3001";

        function onScanSuccess(textoEscaneado, decodedResult) {
            // Evita lecturas masivas del mismo código por 3 segundos
            if (textoEscaneado === ultimoEscaneado) return;
            ultimoEscaneado = textoEscaneado;
            setTimeout(() => ultimoEscaneado = "", 3000); 

            status.innerHTML = "<span style='color:#f1c40f'>⏳ Procesando escaneo...</span>";

            // Al usar QRs limpios, enviamos el texto directamente en la URL
            const urlFinal = `https://${IP_SERVIDOR}:${PUERTO_SSL}/api/escanear/${textoEscaneado}`;
            
            fetch(urlFinal)
                .then(res => {
                    if (res.status === 404) {
                        throw new Error('NOT_FOUND');
                    }
                    if (!res.ok) {
                        throw new Error('SERVER_ERROR');
                    }
                    return res.json();
                })
                .then(data => {
                    // Esto te abrirá una ventana emergente en el celular mostrando el JSON real que llega
                    // alert(JSON.stringify(data)); 

                    if (data && data.success && data.producto && data.producto.nombre) {
                        status.innerHTML = `<b style='color:#2ecc71'>✅ ¡${data.producto.nombre.toUpperCase()} ENVIADO!</b>`;
                    } else {
                        status.innerHTML = "<b style='color:#e74c3c'>❌ RESPUESTA INVÁLIDA DEL SERVIDOR</b>";
                    }
                })
        }

        function onScanFailure(error) {
            // Se mantiene vacío para silenciar logs continuos de enfoque de cámara
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 250, height: 250 } },
            false
        );
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
