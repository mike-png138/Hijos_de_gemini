<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Ventas</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e24; color: white; padding: 20px; text-align: center; }
        .card { background: #2b2b36; padding: 30px; border-radius: 15px; display: inline-block; min-width: 350px; margin-bottom: 20px; }
        .precio { font-size: 2.5em; color: #2ecc71; font-weight: bold; }
        .cart-container { background: #2b2b36; padding: 20px; border-radius: 15px; max-width: 600px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #444; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .btn-eliminar { background: #fcfcfc; padding: 5px 10px; }
    </style>
</head>
<body>
<h1>Monitor de Ventas</h1>

<div class="card">
    <h2 id="prod-nombre">Esperando escaneo...</h2>
    <p class="precio" id="prod-precio">$0.00</p>
    <p id="prod-stock">Stock: --</p>
</div>

<div class="cart-container">
    <h2>Carrito de Ventas</h2>
    <table>
        <thead>
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cant</th>
            <th>Subtotal</th>
            <th>Eliminar:</th>
        </tr>
        </thead>
        <tbody id="listaCarrito"></tbody>
    </table>
    <h3>Total: $<span id="totalVenta">0.00</span></h3>
    <button id="btnCobrar">Cobrar</button>
</div>

<script src="monitor.js"></script>
</body>
</html>
